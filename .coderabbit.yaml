language: "en-US"

tone_instructions: >
  This is an educational portfolio project. Prefer explanations over terse
  corrections — when flagging an issue, briefly explain why it matters.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/html-css/**"
      instructions: >
        Reference implementation — treat as the gold standard for this challenge.
        Flag any regressions in semantic HTML, BEM naming, or accessibility.

    - path: "**/react-css/**"
      instructions: >
        Compare structure against the html-css reference in the same challenge folder.
        Flag deviations not justified by React idioms. Verify: #root has display:contents,
        Google Fonts use async loading (media=print swap), BEM class names match html-css,
        no inline styles, no business logic in presentational components.

    - path: "**/react-tailwind/**"
      instructions: >
        Tailwind v4 utility-class implementation. No stylelint, no BEM class names — this is
        intentional. Compare JSX structure against the react-css variant in the same challenge
        folder. Verify: #root has display:contents in index.css, Google Fonts use async loading
        (media=print swap), custom color tokens are defined in @theme and used via Tailwind
        classes (not hardcoded), no business logic in presentational components.
        Arbitrary values (e.g. rounded-[20px]) are expected for Figma-exact measurements.

    - path: "**/vue-css/**"
      instructions: >
        Vue 3 SFC implementation with scoped styles. Compare template structure against the
        html-css reference in the same challenge folder. Verify: #app has display:contents in
        app.css, Google Fonts use async loading (media=print swap), BEM class names in
        <style scoped> match the html-css variant, image src uses import.meta.env.BASE_URL for
        GitHub Pages compatibility, no business logic in presentational components.
        <style scoped> is intentional — do not suggest CSS Modules or external CSS files.

    - path: "**/*.css"
      instructions: >
        Enforce BEM naming (.block, .block__element, .block--modifier).
        Flag magic numbers — values should match style-guide.md in the challenge folder
        or have a comment explaining the choice.
        The project uses modern CSS color function notation enforced by stylelint-config-standard:
        space-separated with the deg keyword (e.g. hsl(212deg 45% 89%)), not the legacy
        comma-separated form (hsl(212, 45%, 89%)). Do not suggest comma-separated HSL format.

    - path: "**/*.tsx"
      instructions: >
        Components should be small and single-purpose. No any types. Props must be typed.
        Prefer explicit imports over namespace imports.

    - path: "**/*.vue"
      instructions: >
        Vue SFCs should be small and single-purpose. Use <script setup lang="ts">.
        No any types. Props must be typed with defineProps. Prefer explicit imports.
        Scoped styles live in <style scoped> — no separate CSS files for component styles.

    - path: "**/.github/workflows/**"
      instructions: >
        New platform workflows must mirror the structure of 001-html-css.yml:
        separate lint and test jobs, path-scoped triggers, snapshot update dispatch input.
        Verify working-directory and cache-dependency-path point to the correct platform folder.
        SHA pinning for action versions (actions/checkout, actions/setup-node, etc.) is
        intentionally skipped — this is an educational portfolio project, not a production system.
        Do not flag unpinned @v* action tags.

    - path: "**/tests/**"
      instructions: >
        Visual regression tests must cover desktop (1440×900) and mobile (375×812).
        Unit tests should assert content and ARIA attributes, not implementation details
        or CSS class names.

chat:
  auto_reply: true

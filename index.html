<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multi-platform Frontend Mentor challenge solutions by Volodymyr Balashov.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor — Volodymyr Balashov</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Outfit, sans-serif;
      background-color: hsl(218deg 44% 12%);
      color: hsl(212deg 45% 89%);
      min-height: 100vh;
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid hsl(218deg 44% 20%);
    }

    header h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.375rem;
      color: hsl(0deg 0% 100%);
    }

    header p {
      font-size: 0.9375rem;
      color: hsl(216deg 15% 55%);
    }

    header a {
      color: hsl(212deg 45% 75%);
    }

    ol {
      list-style: none;
    }

    .challenge {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 1.125rem 0;
      border-bottom: 1px solid hsl(218deg 44% 20%);
    }

    .challenge__number {
      font-size: 0.75rem;
      font-weight: 600;
      color: hsl(216deg 15% 40%);
      min-width: 2rem;
      letter-spacing: 0.04em;
    }

    .challenge__body {
      flex: 1;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .challenge__name {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-right: 0.25rem;
      color: hsl(0deg 0% 100%);
    }

    .badge {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge--newbie       { background-color: hsl(142deg 50% 90%); color: hsl(142deg 50% 28%); }
    .badge--junior       { background-color: hsl(200deg 70% 90%); color: hsl(200deg 70% 28%); }
    .badge--intermediate { background-color: hsl(38deg 90% 90%);  color: hsl(38deg 80% 30%);  }
    .badge--advanced     { background-color: hsl(350deg 70% 90%); color: hsl(350deg 60% 30%); }
    .badge--guru         { background-color: hsl(270deg 50% 90%); color: hsl(270deg 50% 30%); }

    .challenge__platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-left: auto;
    }

    .platform-link {
      font-size: 0.75rem;
      font-weight: 600;
      color: hsl(212deg 45% 75%);
      text-decoration: none;
      padding: 0.2rem 0.6rem;
      border: 1.5px solid hsl(218deg 44% 30%);
      border-radius: 99px;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }

    .platform-link:hover {
      border-color: hsl(212deg 45% 60%);
      color: hsl(212deg 45% 89%);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: hsl(216deg 15% 35%);
    }

    footer a {
      color: hsl(216deg 15% 45%);
    }
  </style>
</head>
<body>

  <header>
    <h1>Frontend Mentor Challenges</h1>
    <p>By <a href="https://github.com/volod-one">Volodymyr Balashov</a> — multi-platform implementations.</p>
  </header>

  <ol>

    <li class="challenge">
      <span class="challenge__number">001</span>
      <div class="challenge__body">
        <span class="challenge__name">QR Code Component</span>
        <span class="badge badge--newbie">Newbie</span>
        <div class="challenge__platforms">
          <a class="platform-link" href="001-qr-code-component/html-css/">HTML + CSS</a>
          <a class="platform-link" href="001-qr-code-component/react-css/">React + CSS</a>
        </div>
      </div>
    </li>

  </ol>

  <footer>
    <p>Challenges by <a href="https://www.frontendmentor.io">Frontend Mentor</a></p>
  </footer>

</body>
</html>

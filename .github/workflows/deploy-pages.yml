name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*/html-css/**'
      - '*/assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          set -euxo pipefail
          mkdir -p _site
          echo "Repo root contents:"
          ls -la
          for challenge_dir in [0-9]*/; do
            challenge="${challenge_dir%/}"
            echo "Processing: $challenge"
            if [ -d "$challenge/html-css" ]; then
              mkdir -p "_site/$challenge"
              cp -r "$challenge/html-css" "_site/$challenge/html-css"
              if [ -d "$challenge/assets" ]; then
                cp -r "$challenge/assets" "_site/$challenge/assets"
              fi
            fi
          done
          echo "Site contents:"
          find _site -type f

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment

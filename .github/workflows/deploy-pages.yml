name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*/html-css/**'
      - '*/assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site

          # collect challenge links for the index page
          links=""
          for challenge_dir in [0-9]*/; do
            challenge="${challenge_dir%/}"
            if [ -d "$challenge/html-css" ]; then
              mkdir -p "_site/$challenge"
              cp -r "$challenge/html-css" "_site/$challenge/html-css"
              if [ -d "$challenge/assets" ]; then
                cp -r "$challenge/assets" "_site/$challenge/assets"
              fi
              links="$links<li><a href=\"$challenge/html-css/\">$challenge — HTML+CSS</a></li>"
            fi
          done

          # generate root index
          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Frontend Mentor Challenges</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
              ul { line-height: 2; }
            </style>
          </head>
          <body>
            <h1>Frontend Mentor Challenges</h1>
            <ul>$links</ul>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment

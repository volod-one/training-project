name: 001 QR Code — React+Tailwind

on:
  push:
    paths:
      - '001-qr-code-component/react-tailwind/**'
      - '!001-qr-code-component/react-tailwind/**/*.md'
      - '.github/workflows/001-react-tailwind.yml'
  pull_request:
    paths:
      - '001-qr-code-component/react-tailwind/**'
      - '!001-qr-code-component/react-tailwind/**/*.md'
      - '.github/workflows/001-react-tailwind.yml'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate and commit Linux baseline snapshots'
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 001-qr-code-component/react-tailwind

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '001-qr-code-component/react-tailwind/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '001-qr-code-component/react-tailwind/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint JS/TS
        run: npm run lint:js

      - name: Unit tests
        run: npm run test:unit

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: 001-qr-code-component/react-tailwind

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '001-qr-code-component/react-tailwind/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '001-qr-code-component/react-tailwind/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual tests
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual

      - name: Update baseline snapshots
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:update

      - name: Commit updated snapshots
        if: ${{ inputs.update_snapshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/snapshots/
          git diff --staged --quiet || git commit -m "test: update linux snapshot baselines [skip ci]"
          git push

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 001-qr-code-component/react-tailwind/test-results/
          retention-days: 7
